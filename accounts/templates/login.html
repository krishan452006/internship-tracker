<!DOCTYPE html>
<html>
<head>

    <title>Login | Internship Tracker</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            width: 350px;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #d1d5db;
            border-radius: 6px;

            font-size: 15px;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #2563eb;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: #dc2626;
            text-align: center;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>Student Login</h1>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>
        <div style="
    text-align: center;
    margin-top: 20px;
">

    Don't have an account?

    <a href="{% url 'register' %}"
       style="
           color: #2563eb;
           text-decoration: none;
           font-weight: bold;
       ">
        Register
    </a>

</div>

    </div>

</body>
</html>
